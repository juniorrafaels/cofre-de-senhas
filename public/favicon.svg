<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Proposta de ícone original do Cofre de Contas (porta de cofre + buraco de fechadura).
       Desenho criado para o projeto; pode ser licenciado junto com o código. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#0F766E"/>
    </linearGradient>
    <linearGradient id="door" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#bg)"/>
  <!-- corpo do cofre -->
  <rect x="192" y="208" width="640" height="608" rx="88" fill="url(#door)"/>
  <!-- dobradiças -->
  <rect x="160" y="312" width="48" height="104" rx="16" fill="#94A3B8"/>
  <rect x="160" y="608" width="48" height="104" rx="16" fill="#94A3B8"/>
  <!-- roda do segredo -->
  <circle cx="512" cy="512" r="196" fill="#1E293B"/>
  <circle cx="512" cy="512" r="160" fill="none" stroke="#5EEAD4" stroke-width="20"/>
  <g stroke="#5EEAD4" stroke-width="20" stroke-linecap="round">
    <line x1="512" y1="352" x2="512" y2="392"/>
    <line x1="512" y1="632" x2="512" y2="672"/>
    <line x1="352" y1="512" x2="392" y2="512"/>
    <line x1="632" y1="512" x2="672" y2="512"/>
  </g>
  <!-- buraco da fechadura -->
  <circle cx="512" cy="478" r="52" fill="#F8FAFC"/>
  <path d="M482 500 L542 500 L566 600 L458 600 Z" fill="#F8FAFC"/>
</svg>
