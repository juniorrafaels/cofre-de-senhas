# Dependabot só PROPÕE atualizações (pull requests); nada é mesclado automaticamente.
# Atualizações minor/patch são agrupadas por ecossistema para evitar dezenas de PRs; majors vêm
# separados, para revisão individual. As Actions estão fixadas por SHA (ver workflows) e o
# Dependabot também atualiza esses SHAs.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]
    ignore:
      # rand/rand_chacha fixam o fluxo de coeficientes do Shamir das perguntas de segurança
      # (dealer v1, shares já gravadas em cofres existentes). A 0.10 exige migração conjunta e
      # reescrita dos usos de OsRng/gen_range, e só pode ser aceita se os vetores de
      # security_questions/shamir continuarem passando. Ver docs/CREDENCIAIS_E_RECUPERACAO.md.
      - dependency-name: "rand"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "rand_chacha"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
