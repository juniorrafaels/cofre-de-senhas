# Dependabot só PROPÕE atualizações (pull requests); nada é mesclado automaticamente.
# Atualizações minor/patch são agrupadas por ecossistema para evitar dezenas de PRs; majors vêm
# separados, para revisão individual. As Actions estão fixadas por SHA (ver workflows) e o
# Dependabot também atualiza esses SHAs.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
