# Análise estática CodeQL do código TypeScript/React do frontend.
#
# LIMITE: cobre só JavaScript/TypeScript. NÃO analisa o backend Rust (onde ficam criptografia,
# banco e comandos Tauri); para ele continuam valendo clippy, cargo audit e os testes do CI.
# Esta análise não substitui uma auditoria de segurança independente.
#
# Se o "CodeQL default setup" estiver ativado em Settings → Code security, desative-o: ele
# conflita com este workflow (o upload dos resultados falha).
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # segundas, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analisar (JavaScript/TypeScript)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write # enviar os resultados para a aba Security
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:javascript-typescript"
