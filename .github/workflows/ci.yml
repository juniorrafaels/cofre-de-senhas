# Integração contínua do Cofre de Contas.
#
# Valida, em uma máquina Windows limpa do GitHub, que o projeto instala, passa nos testes e compila
# sem depender da máquina de desenvolvimento. NÃO publica releases, NÃO envia instaladores para
# lugar nenhum e não usa segredos.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Testes e build (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable (sem tags de versão)
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Instalar dependências (lockfile)
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Testes do frontend (Vitest)
        run: npm test

      - name: Build do frontend
        run: npm run build

      - name: Testes do backend (Rust)
        working-directory: src-tauri
        run: cargo test --lib --locked

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets

      # Compila o app de produção (frontend embutido + Rust release) sem gerar instaladores.
      # O binário fica só no runner, não é publicado.
      - name: Build Tauri (sem instaladores)
        run: npx tauri build --no-bundle

  # Só roda quando disparado à mão (Actions → CI → Run workflow). Gera os instaladores numa máquina
  # limpa do GitHub — os binários não carregam caminhos da máquina de desenvolvimento — e os anexa
  # ao run como artefato temporário, junto com os hashes SHA-256, para conferência. NÃO cria
  # release nem publica nada.
  installers:
    name: Instaladores para conferência (manual)
    if: github.event_name == 'workflow_dispatch'
    needs: test-and-build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # branch stable (sem tags de versão)
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Build Tauri (MSI + NSIS)
        run: npx tauri build

      # Mesmo script da release: nomes sem espaços, SHA-256 dos arquivos copiados e SHA256SUMS.txt
      # em LF (conferível com `sha256sum -c`). A versão esperada vem de tauri.conf.json.
      - name: Reunir instaladores, padronizar nomes e calcular SHA-256
        shell: bash
        run: node scripts/release-assets.mjs --from-manifests --bundle-dir src-tauri/target/release/bundle --out-dir release-assets

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instaladores-${{ github.sha }}
          path: release-assets
          if-no-files-found: error
          retention-days: 7

  # Testes dos scripts de release (versões da tag, nomes dos instaladores, SHA256SUMS.txt) numa
  # máquina Linux, onde o GNU `sha256sum -c` existe de verdade — é ele que confere o manifesto na
  # release. (Os mesmos testes também rodam no job Windows via `npm test`, sem o sha256sum.)
  release-scripts:
    name: Scripts de release (Linux, sha256sum real)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Testes dos scripts de release
        run: |
          set -euo pipefail
          sha256sum --version | head -1
          npx vitest run scripts --reporter=verbose 2>&1 | tee vitest-scripts.log
          if grep -qi "skipped" vitest-scripts.log; then echo "::error::Testes de release foram pulados (sha256sum ausente?)"; exit 1; fi

  audit:
    name: Auditoria de dependências
    # Fixado: ubuntu-latest migra para o Ubuntu 26 em 19/10/2026. Subir de versão de propósito,
    # depois de conferir que o cargo-audit e o npm audit continuam funcionando.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Só as dependências que vão para o app. Alertas de ferramentas de build aparecem no
      # `npm audit` completo, que roda abaixo sem bloquear o CI.
      - name: npm audit (produção)
        run: npm audit --omit=dev --audit-level=high

      - name: npm audit (completo, informativo)
        run: npm audit || true

      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
